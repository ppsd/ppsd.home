# เงินเดือนบน Cloudflare Pages (https://ppsd-payroll.pages.dev) — อัปเดตด้วย `node scripts/deploy-payroll.mjs`
# ต้องใช้ wrangler 4.20.0 เท่านั้น (รุ่นใหม่จะพยายามย้ายไป Workers) · ความลับตั้งด้วยสคริปต์ (อ่านจาก ERP) ไม่อยู่ในไฟล์นี้
name = "ppsd-payroll"
pages_build_output_dir = "./public"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "ppsd-payroll"
database_id = "48512628-b001-45b1-8162-a915596b5879"
