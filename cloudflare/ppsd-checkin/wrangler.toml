# หน้าลงเวลาพนักงานบน Cloudflare Pages (https://ppsd-checkin.pages.dev) — อัปเดตด้วย `node scripts/deploy-checkin.mjs`
# ต้องใช้ wrangler 4.20.0 เท่านั้น (รุ่นใหม่จะพยายามย้ายไป Workers)
# ความลับ CLOUD_KEY / SYNC_TOKEN ตั้งด้วยสคริปต์ (อ่านจาก ERP) — ไม่อยู่ในไฟล์นี้
name = "ppsd-checkin"
pages_build_output_dir = "./public"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "ppsd-checkin"
database_id = "c1906ad2-3dc6-4293-a77e-acbfcba4ce9a"
