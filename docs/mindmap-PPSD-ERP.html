<meta charset="utf-8">

<title>PPSD ERP Mindmap</title>
<style>
:root{
  --bg:#F3F5F7; --panel:#ffffff; --ink:#1C2730; --muted:#5C6770; --line:#C9D2DA;
  --root:#30506A; --rootInk:#ffffff; --hl:#F6C744;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A21; --panel:#1B2630; --ink:#E6ECF1; --muted:#9AA8B4; --line:#34444F;
    --root:#5D8AAE; --rootInk:#0E151B; --hl:#B8902A;
  }
}
:root[data-theme="dark"]{
  --bg:#121A21; --panel:#1B2630; --ink:#E6ECF1; --muted:#9AA8B4; --line:#34444F;
  --root:#5D8AAE; --rootInk:#0E151B; --hl:#B8902A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Kanit","Sarabun","Leelawadee UI",Tahoma,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:600}
header .sp{flex:1}
button,input{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--root)}
input{width:200px}
#hint{font-size:12px;color:var(--muted)}
#stage{position:absolute;top:54px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
svg{display:block;width:100%;height:100%}
.node rect{stroke-width:1.5;rx:9}
.node text{font-size:13px;fill:var(--ink);dominant-baseline:middle}
.node.root text{font-size:17px;font-weight:600;fill:var(--rootInk)}
.node.l1 text{font-weight:600;font-size:14px}
.node.click{cursor:pointer}
.node .tog{font-size:11px;fill:var(--muted)}
.node.hit rect{stroke:var(--hl)!important;stroke-width:3}
path.link{fill:none;stroke-width:1.6;opacity:.75}
@media (max-width:640px){ input{width:130px} #hint{display:none} }
@media print{ header{display:none} #stage{top:0} }
</style>
</head>

let uid = 0;
function prep(n, depth, color, parent){
  n.id = uid++; n.depth = depth; n.parent = parent; n.color = color;
  n.open = depth < 2;
  (n.c||[]).forEach((ch, i) => prep(ch, depth+1, depth === 0 ? i : color, n));
}

const svg = document.getElementById('svg'), vp = document.getElementById('vp');
const NS = 'http://www.w3.org/2000/svg';
const measure = document.createElementNS(NS, 'text'); measure.setAttribute('visibility','hidden'); svg.appendChild(measure);
function textW(t, depth){
  measure.setAttribute('style', `font-size:${depth===0?17:depth===1?14:13}px;font-weight:${depth<2?600:400};font-family:Kanit,Sarabun,'Leelawadee UI',Tahoma,sans-serif`);
  measure.textContent = t; return measure.getComputedTextLength();
}

const ROW = 30, GAP_X = 46;
// layout: วางลูกเป็นคอลัมน์ ด้านซ้าย/ขวาของราก
function layoutSide(nodes, dir, x0){
  let y = 0;
  function place(n, x){
    n.w = textW(n.t, n.depth) + 26 + ((n.c && n.c.length) ? 16 : 0);
    n.h = n.depth === 1 ? 32 : 26;
    n.dir = dir;
    const kids = n.open ? (n.c||[]) : [];
    const nx = dir > 0 ? x : x - n.w;
    n.x = nx;
    if(!kids.length){ n.y = y; y += ROW; return; }
    const childX = dir > 0 ? x + n.w + GAP_X : x - n.w - GAP_X;
    kids.forEach(k => place(k, childX));
    n.y = (kids[0].y + kids[kids.length-1].y) / 2;
  }
  nodes.forEach((n, i) => { place(n, x0); y += 14; });
  return y;
}
function layout(){
  const r = DATA;
  r.w = textW(r.t, 0) + 40; r.h = 46; r.x = -r.w/2;
  const L = r.c.filter(n => n.side === 'L'), R = r.c.filter(n => n.side !== 'L');
  const hR = layoutSide(R, 1, r.w/2 + 70);
  const hL = layoutSide(L, -1, -r.w/2 - 70);
  // จัดกึ่งกลางแนวตั้ง
  const shift = (arr, h) => { const off = -h/2; const walk = n => { n.y += off; if(n.open) (n.c||[]).forEach(walk); }; arr.forEach(walk); };
  shift(R, hR); shift(L, hL);
  r.y = 0;
}

function visible(n, out = []){ out.push(n); if(n.open) (n.c||[]).forEach(k => visible(k, out)); return out; }

let query = '';
function render(){
  layout();
  const dark = isDark(), pal = dark ? PAL_D : PAL_L;
  vp.innerHTML = '';
  const gLinks = document.createElementNS(NS, 'g'), gNodes = document.createElementNS(NS, 'g');
  vp.appendChild(gLinks); vp.appendChild(gNodes);
  for(const n of visible(DATA)){
    const col = n.depth === 0 ? 'var(--root)' : pal[n.color % pal.length];
    // เส้นเชื่อม
    if(n.parent){
      const p = n.parent;
      const px = p.depth === 0 ? (n.dir > 0 ? p.x + p.w : p.x) : (n.dir > 0 ? p.x + p.w : p.x);
      const py = p.y;
      const cx = n.dir > 0 ? n.x : n.x + n.w, cy = n.y;
      const mx = (px + cx) / 2;
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', `M${px},${py} C${mx},${py} ${mx},${cy} ${cx},${cy}`);
      path.setAttribute('class', 'link'); path.setAttribute('stroke', col);
      gLinks.appendChild(path);
    }
    const g = document.createElementNS(NS, 'g');
    const has = n.c && n.c.length;
    const hit = query && n.t.toLowerCase().includes(query);
    g.setAttribute('class', `node ${n.depth===0?'root':n.depth===1?'l1':''} ${has?'click':''} ${hit?'hit':''}`);
    g.setAttribute('transform', `translate(${n.x},${n.y - n.h/2})`);
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('width', n.w); rect.setAttribute('height', n.h); rect.setAttribute('rx', n.depth===0?14:9);
    if(n.depth === 0){ rect.setAttribute('fill', 'var(--root)'); rect.setAttribute('stroke', 'var(--root)'); }
    else if(n.depth === 1){ rect.setAttribute('fill', col); rect.setAttribute('fill-opacity', dark ? .28 : .14); rect.setAttribute('stroke', col); }
    else { rect.setAttribute('fill', 'var(--panel)'); rect.setAttribute('stroke', col); rect.setAttribute('stroke-opacity', .7); }
    g.appendChild(rect);
    const tx = document.createElementNS(NS, 'text');
    tx.setAttribute('x', 13); tx.setAttribute('y', n.h/2 + 1); tx.textContent = n.t;
    g.appendChild(tx);
    if(has && n.depth > 0){
      const tg = document.createElementNS(NS, 'text');
      tg.setAttribute('class', 'tog'); tg.setAttribute('x', n.w - 16); tg.setAttribute('y', n.h/2 + 1);
      tg.textContent = n.open ? '−' : `+${n.c.length}`;
      if(!n.open) tg.setAttribute('x', n.w - 22);
      g.appendChild(tg);
    }
    if(has && n.depth > 0) g.addEventListener('click', e => { e.stopPropagation(); n.open = !n.open; render(); });
    gNodes.appendChild(g);
  }
  applyView();
}

// ===== pan / zoom =====
let view = {x: 0, y: 0, k: 1};
function applyView(){ vp.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }
function fit(){
  const b = vp.getBBox(), W = svg.clientWidth, H = svg.clientHeight;
  const k = Math.min(1.4, Math.max(0.2, Math.min((W - 40) / b.width, (H - 40) / b.height)));
  view.k = k; view.x = W/2 - (b.x + b.width/2) * k; view.y = H/2 - (b.y + b.height/2) * k; applyView();
}
const stage = document.getElementById('stage');
let drag = null;
stage.addEventListener('pointerdown', e => { if(e.target.closest('.node.click')) return; drag = {x: e.clientX - view.x, y: e.clientY - view.y}; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => { if(!drag) return; view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; applyView(); });
stage.addEventListener('pointerup', () => { drag = null; stage.classList.remove('drag'); });
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k2 = Math.min(3, Math.max(0.15, view.k * (e.deltaY < 0 ? 1.12 : 1/1.12)));
  view.x = mx - (mx - view.x) * k2 / view.k; view.y = my - (my - view.y) * k2 / view.k; view.k = k2; applyView();
}, {passive: false});

// ===== ปุ่ม =====
const all = (n, f) => { f(n); (n.c||[]).forEach(k => all(k, f)); };
document.getElementById('expandAll').onclick = () => { all(DATA, n => n.open = true); render(); fit(); };
document.getElementById('collapseAll').onclick = () => { all(DATA, n => n.open = n.depth < 2); render(); fit(); };
document.getElementById('fit').onclick = fit;
document.getElementById('q').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  if(query) all(DATA, n => { if(n.t.toLowerCase().includes(query)) for(let p = n.parent; p; p = p.parent) p.open = true; });
  render();
});
document.getElementById('theme').onclick = () => {
  const root = document.documentElement;
  root.dataset.theme = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('ppsd-mm-theme', root.dataset.theme); } catch(e) {}
  render();
};
try { const t = localStorage.getItem('ppsd-mm-theme'); if(t) document.documentElement.dataset.theme = t; } catch(e) {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
const placeStage = () => { stage.style.top = document.querySelector('header').offsetHeight + 'px'; };
window.addEventListener('resize', () => { placeStage(); fit(); });

placeStage(); render(); fit();
</script>
</body>
